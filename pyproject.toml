[project]
name = "courseutils"
version = "0.1.0"
description = "Utilities for the course"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.26.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nvidia-ml-py>=13.610.43",
    "pandas>=3.0.1",
    "plotly>=6.8.0",
    "scikit-learn>=1.8.0",
    "timm>=1.0.28",
    "torch>=2.2",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[tool.uv]
torch-backend = "auto"
